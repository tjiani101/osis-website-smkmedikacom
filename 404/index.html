<!DOCTYPE html>
<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | OSIS SMK Medikacom</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Liquid Theme Styles -->
    <link rel="stylesheet" href="../assets/css/liquid-theme.css">

<body class="min-h-screen flex items-center justify-center p-4 selection:bg-blue-500/30 selection:text-white">

    <div class="main-overlay"></div>

    <div class="w-full max-w-lg text-center">

            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-mono text-blue-300 mb-6">

            </div>

            <h1 class="text-7xl sm:text-8xl font-black tracking-tightest mb-2 font-mono text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">

            <h2 class="text-2xl font-bold text-white mb-3">
                Oops, Kamu Tersesat di Luar Angkasa!
            </h2>

            <p class="text-sm text-white/70 max-w-sm mx-auto mb-8 leading-relaxed">

            </p>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <a href="../index.html" class="liquid-btn px-8 py-3.5 text-sm font-bold w-full sm:w-auto">
                    Kembali ke Beranda
                </a>
                <a href="../pages/forum/" class="liquid-btn-secondary px-8 py-3.5 text-sm font-semibold w-full sm:w-auto">
                    Ke Forum Diskusi
                </a>
            </div>

            <div class="mt-8 pt-6 border-t border-white/10 text-xs text-white/40">
                OSIS & MPK SMK Medikacom Bandung
            </div>
        </div>
    </div>

</body>
