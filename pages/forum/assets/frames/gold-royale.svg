<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a8" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Gold Laurel / Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGradient)" stroke-width="12" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#fffbeb" stroke-width="2" stroke-dasharray="6 12" opacity="0.9"/>
  <!-- Crown at Top -->
  <g transform="translate(256, 40) scale(1.2)">
    <path d="M -30 20 L -40 -15 L -15 0 L 0 -25 L 15 0 L 40 -15 L 30 20 Z" fill="url(#goldGradient)" stroke="#fffbeb" stroke-width="2" filter="url(#goldGlow)"/>
    <circle cx="-40" cy="-15" r="4" fill="#ef4444" stroke="#fff" stroke-width="1"/>
    <circle cx="0" cy="-25" r="5" fill="#3b82f6" stroke="#fff" stroke-width="1"/>
    <circle cx="40" cy="-15" r="4" fill="#ef4444" stroke="#fff" stroke-width="1"/>
    <polygon points="0,5 5,12 12,12 7,17 9,24 0,19 -9,24 -7,17 -12,12 -5,12" fill="#fff" opacity="0.9"/>
  </g>
  <!-- Jewels on side -->
  <polygon points="36,256 46,244 56,256 46,268" fill="#f59e0b" stroke="#fff" stroke-width="1.5" filter="url(#goldGlow)"/>
  <polygon points="476,256 466,244 456,256 466,268" fill="#f59e0b" stroke="#fff" stroke-width="1.5" filter="url(#goldGlow)"/>
  <!-- Bottom Ribbon -->
  <g transform="translate(256, 470)">
    <path d="M -60 -10 L 60 -10 L 50 15 L 0 8 L -50 15 Z" fill="url(#goldGradient)" stroke="#fffbeb" stroke-width="1.5"/>
    <text x="0" y="4" fill="#78350f" font-size="11" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1.5">ROYALE</text>
  </g>
</svg>
