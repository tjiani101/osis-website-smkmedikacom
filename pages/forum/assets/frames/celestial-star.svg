<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Cosmic Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#cosmicGrad)" stroke-width="10" filter="url(#starGlow)"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#e0e7ff" stroke-width="1.5" stroke-dasharray="8 16" opacity="0.7"/>
  <!-- Orbit Ellipse -->
  <ellipse cx="256" cy="256" rx="245" ry="120" fill="none" stroke="#c084fc" stroke-width="2" transform="rotate(-30 256 256)" opacity="0.6"/>
  <!-- Orbiting Planets / Stars -->
  <g transform="translate(256, 30)">
    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#fff" filter="url(#starGlow)"/>
  </g>
  <g transform="translate(470, 200)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#38bdf8" filter="url(#starGlow)"/>
  </g>
  <g transform="translate(42, 312)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#c084fc" filter="url(#starGlow)"/>
  </g>
  <!-- Bottom Crescent Moon -->
  <g transform="translate(256, 470) scale(1.1)">
    <circle cx="0" cy="0" r="16" fill="url(#cosmicGrad)" filter="url(#starGlow)"/>
    <circle cx="6" cy="-4" r="14" fill="#0b1021"/>
  </g>
</svg>
